name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      # No install step: this package has zero dependencies, by design.
      - name: Test
        run: node --test test/*.test.mjs
      - name: Self-scan (the tool must survive its own rules)
        run: node bin/illusion.mjs ./src ./bin --no-exit-code
